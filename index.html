<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#263d2c">
<title>Fieldnote — A nature journal</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');

:root {
  --forest: #294735;
  --deep: #203629;
  --leaf: #6f8966;
  --sage: #dfe8d8;
  --mist: #eff2e9;
  --cream: #f7f7f0;
  --paper: #fffefa;
  --ink: #29392f;
  --muted: #879286;
  --line: #e5e9df;
  --gold: #c49b58;
  --shadow: 0 18px 50px #243d3014;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: 'DM Sans',system-ui,sans-serif;
}

button,input,select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible,input:focus-visible,select:focus-visible {
  outline: 3px solid #aec59f;
  outline-offset: 2px;
}

#app {
  min-height: 100vh;
}

.layout {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 238px minmax(0,1fr);
}

.sidebar {
  height: 100vh;
  position: sticky;
  top: 0;
  padding: 25px 17px;
  background: #eef1e9;
  border-right: 1px solid #e2e8dc;
  display: flex;
  flex-direction: column;
  z-index: 4;
}

.brand {
  display: flex;
  gap: 11px;
  align-items: center;
  padding: 3px 8px 32px;
}

.brand-mark {
  width: 43px;
  height: 43px;
  border-radius: 15px;
  background: var(--forest);
  display: grid;
  place-items: center;
  color: #f7f5e9;
  font-size: 24px;
  box-shadow: 0 7px 17px #29473525;
}

.brand-name {
  font: 600 25px 'Playfair Display',Georgia,serif;
  color: #2d4736;
}

.brand-tag {
  font-size: 8px;
  letter-spacing: 1.8px;
  font-weight: 700;
  color: #91a08d;
}

.nav-label {
  font-size: 9px;
  letter-spacing: 1.7px;
  color: #9aa598;
  font-weight: 700;
  padding: 0 12px 10px;
}

.nav {
  display: grid;
  gap: 5px;
}

.nav-btn {
  border: 0;
  background: transparent;
  color: #748174;
  border-radius: 11px;
  padding: 12px 13px;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 600;
  font-size: 12px;
  transition: .2s;
}

.nav-btn:hover {
  background: #e5eadf;
  color: var(--forest);
  transform: translateX(2px);
}

.nav-btn.active {
  background: #dfe8d8;
  color: #294a36;
}

.nav-ico {
  width: 19px;
  text-align: center;
  font-size: 17px;
}

.side-bottom {
  margin-top: auto;
  padding: 15px;
  background: #e3eadc;
  border: 1px solid #dce5d4;
  border-radius: 15px;
  position: relative;
  overflow: hidden;
}

.side-bottom:after {
  content: '❧';
  position: absolute;
  right: 2px;
  bottom: -23px;
  font-size: 77px;
  color: #c4d2bc;
  transform: rotate(-20deg);
}

.small-cap {
  font-size: 9px;
  letter-spacing: 1.6px;
  font-weight: 700;
  color: #80917a;
}

.side-quote {
  font: 18px 'Playfair Display',Georgia,serif;
  color: #36513a;
  margin: 8px 0 4px;
}

.side-text {
  font-size: 10px;
  line-height: 1.6;
  color: #7d8979;
  max-width: 155px;
  position: relative;
  z-index: 1;
}

.main {
  min-width: 0;
  width: 100%;
  max-width: 1600px;
  margin: 0 auto;
  padding: 25px clamp(18px,4vw,55px) 60px;
}

.topbar {
  height: 43px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 27px;
  gap: 12px;
}

.crumb {
  font-size: 10px;
  letter-spacing: 1.7px;
  font-weight: 700;
  color: #929d90;
  text-transform: uppercase;
}

.top-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.search {
  height: 38px;
  width: min(230px,43vw);
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--paper);
  display: flex;
  align-items: center;
  padding: 0 11px;
  gap: 8px;
}

.search span {
  color: #899788;
}

.search input {
  border: 0;
  outline: 0;
  width: 100%;
  min-width: 0;
  background: transparent;
  font-size: 11px;
  color: var(--ink);
}

.avatar {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: #dfe8d8;
  color: var(--forest);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 15px;
}

.page {
  animation: arrive .38s ease both;
}

@keyframes arrive {
  from {
    opacity: 0;
    transform: translateY(9px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.eyebrow {
  font-size: 9px;
  letter-spacing: 1.8px;
  color: #879783;
  font-weight: 700;
}

.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 24px;
}

.page-title {
  font: 600 clamp(29px,3.5vw,40px)/1.12 'Playfair Display',Georgia,serif;
  letter-spacing: -.6px;
  color: #2c4333;
  margin: 8px 0;
}

.subtitle {
  font-size: 12px;
  line-height: 1.7;
  color: #899589;
  margin: 0;
}

.primary {
  border: 0;
  border-radius: 11px;
  background: var(--forest);
  color: #fffdf4;
  padding: 12px 16px;
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 5px 14px #29473520;
  transition: transform .2s,background .2s;
}

.primary:hover {
  background: #1d3828;
  transform: translateY(-2px);
}

.secondary {
  border: 1px solid #dfe6da;
  background: #fffefa;
  color: #536c53;
  padding: 10px 13px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 700;
}

.secondary:hover {
  background: #eff4ec;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 12px;
  margin-bottom: 22px;
}

.stat {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 15px;
}

.stat-label {
  display: flex;
  justify-content: space-between;
  color: #889488;
  font-size: 10px;
  font-weight: 600;
}

.stat-icon {
  width: 29px;
  height: 29px;
  border-radius: 10px;
  background: #edf2e9;
  display: grid;
  place-items: center;
  font-size: 15px;
}

.stat-num {
  font: 31px 'Playfair Display',Georgia,serif;
  color: #31503a;
  margin: 5px 0 1px;
}

.stat-caption {
  font-size: 9px;
  color: #9aa397;
}

.hero {
  height: 235px;
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  margin-bottom: 28px;
  background: linear-gradient(125deg,#263f2e,#587656 60%,#9aa984);
}

.hero:before {
  content: '✧  ❧  ✦';
  position: absolute;
  right: 8%;
  top: 15%;
  color: #dce8d388;
  font-size: 72px;
  letter-spacing: 10px;
  transform: rotate(-15deg);
}

.hero:after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg,#152e22e8,#1d392d7e 55%,#1d392d05);
}

.hero-text {
  position: absolute;
  left: 30px;
  top: 27px;
  z-index: 1;
  color: white;
  max-width: 370px;
}

.hero-kicker {
  font-size: 9px;
  letter-spacing: 2px;
  font-weight: 700;
  color: #e0ead7;
}

.hero-title {
  font: 500 clamp(26px,3vw,34px)/1.16 'Playfair Display',Georgia,serif;
  margin: 11px 0 7px;
}

.hero-copy {
  font-size: 11px;
  line-height: 1.65;
  color: #e1e9dd;
  max-width: 290px;
}

.hero-btn {
  margin-top: 14px;
  border: 1px solid #ffffff85;
  border-radius: 8px;
  padding: 9px 12px;
  color: white;
  background: #ffffff20;
  font-size: 10px;
  font-weight: 700;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.section-title {
  font: 22px 'Playfair Display',Georgia,serif;
  color: #304a37;
}

.meta {
  font-size: 10px;
  color: #929c90;
}

.filters {
  display: flex;
  gap: 7px;
  overflow: auto;
  padding: 2px 0 15px;
  scrollbar-width: none;
}

.filter {
  flex: none;
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 30px;
  padding: 8px 13px;
  color: #7e8b7d;
  font-size: 10px;
  font-weight: 600;
}

.filter.active {
  background: var(--forest);
  border-color: var(--forest);
  color: #fff;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 15px;
}

.species-card {
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--paper);
  overflow: hidden;
  text-align: left;
  min-width: 0;
  transition: .22s;
  color: inherit;
}

.species-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow);
}

.species-photo {
  height: 150px;
  position: relative;
  background: linear-gradient(135deg,#d0ddc6,#738b6c);
  overflow: hidden;
  display: grid;
  place-items: center;
}

.species-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.species-placeholder {
  font-size: 37px;
  opacity: .85;
}

.species-photo:after {
  content: '';
  position: absolute;
  inset: 45% 0 0;
  background: linear-gradient(transparent,#172b1d55);
  pointer-events: none;
}

.tag {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 1;
  padding: 5px 9px;
  border-radius: 20px;
  background: #fffef0ef;
  color: #49634b;
  font-size: 8px;
  font-weight: 800;
}

.species-info {
  padding: 12px 14px 13px;
}

.species-name {
  font: 17px 'Playfair Display',Georgia,serif;
  color: #304a37;
}

.latin {
  font-size: 9px;
  color: #98a295;
  font-style: italic;
  margin-top: 4px;
}

.species-foot {
  border-top: 1px solid #eff1e9;
  margin-top: 11px;
  padding-top: 9px;
  display: flex;
  justify-content: space-between;
  color: #89958a;
  font-size: 9px;
}

.empty {
  padding: 36px 20px;
  text-align: center;
  border: 1px dashed #d6dfd1;
  border-radius: 15px;
  background: #fffefa;
  color: #859282;
  font-size: 12px;
  grid-column: 1/-1;
}

.empty .empty-leaf {
  font-size: 32px;
  margin-bottom: 9px;
  color: #789072;
}

.spot-wrap {
  max-width: 950px;
  margin: 0 auto;
}

.spot-intro {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 14px;
  margin-bottom: 19px;
}

.spot-pill {
  white-space: nowrap;
  background: #eaf0e5;
  color: #657c5f;
  border-radius: 30px;
  padding: 8px 11px;
  font-size: 9px;
}

.spot-card {
  background: linear-gradient(145deg,#fffefa,#f8f8f0);
  border: 1px solid #e5e9df;
  border-radius: 22px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.spot-card-top {
  padding: 21px 25px 14px;
  background: linear-gradient(115deg,#f0f4e9,#faf9f2);
  border-bottom: 1px solid #e9ede4;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.spot-card-top strong {
  font: 20px 'Playfair Display',Georgia,serif;
  color: #36533b;
}

.spot-card-top span {
  font-size: 9px;
  color: #879582;
  letter-spacing: 1px;
}

.spot-grid {
  padding: 22px 25px 25px;
  display: grid;
  grid-template-columns: 1.1fr .9fr;
  gap: 20px;
}

.form-section {
  margin-bottom: 19px;
}

.form-section:last-child {
  margin-bottom: 0;
}

.form-label {
  font-size: 10px;
  color: #71816e;
  font-weight: 700;
  letter-spacing: .6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.control {
  width: 100%;
  height: 46px;
  border: 1px solid #e1e7dd;
  background: #fffefa;
  border-radius: 11px;
  padding: 0 13px;
  color: #435446;
  font-size: 12px;
  box-shadow: 0 2px 4px #203a2505;
}

.control:focus {
  border-color: #a6b99d;
  outline: 3px solid #e4eddf;
}

.control:disabled {
  opacity: .55;
  background: #f2f3ed;
}

.species-select {
  font-size: 13px;
  height: 50px;
}

.helper {
  font-size: 9px;
  color: #9aa398;
  line-height: 1.6;
  margin-top: 7px;
}

.photo-drop {
  min-height: 185px;
  border: 1px dashed #cbd8c5;
  border-radius: 16px;
  background: #f4f7ef;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
  position: relative;
  transition: .25s;
}

.photo-drop:hover {
  border-color: #94ad8e;
  background: #eff5ea;
}

.photo-drop img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-empty {
  padding: 20px;
  position: relative;
  z-index: 1;
}

.photo-symbol {
  font-size: 31px;
  color: #879d7d;
  margin-bottom: 8px;
}

.photo-empty strong {
  font: 17px 'Playfair Display',Georgia,serif;
  color: #476249;
  display: block;
}

.photo-empty small {
  font-size: 9px;
  color: #929e8e;
  display: block;
  margin-top: 5px;
}

.photo-change {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  background: #fffef1eF;
  border: 1px solid #e1e7dc;
  color: #456044;
  border-radius: 30px;
  padding: 8px 12px;
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
}

.loc-card {
  border: 1px solid #e1e8dc;
  border-radius: 15px;
  background: #f8f9f3;
  padding: 13px;
}

.loc-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}

.loc-title {
  font: 16px 'Playfair Display',Georgia,serif;
  color: #3a563e;
}

.loc-status {
  font-size: 9px;
  color: #899787;
}

.loc-actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.loc-map {
  height: 175px;
  width: 100%;
  border: 0;
  border-radius: 11px;
  background: #e7eddf;
  display: block;
  margin-top: 11px;
}

.map-placeholder {
  height: 175px;
  border-radius: 11px;
  margin-top: 11px;
  background: radial-gradient(circle at 35% 45%,#d9e5d0 0 8%,transparent 8.5%),linear-gradient(25deg,transparent 45%,#fffefa 46% 49%,transparent 50%),linear-gradient(135deg,#dfe9d9,#edf0e5);
  display: grid;
  place-items: center;
  text-align: center;
  color: #71836d;
  font-size: 10px;
  padding: 14px;
}

.day-select {
  height: 46px;
}

.spot-bottom {
  padding: 15px 25px 19px;
  border-top: 1px solid #e9ede4;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  background: #fbfbf6;
}

.private-note {
  font-size: 9px;
  color: #8c9889;
  line-height: 1.5;
  max-width: 400px;
}

.log-btn {
  padding: 14px 22px;
  font-size: 12px;
  border-radius: 12px;
}

.form-error {
  display: none;
  margin: 12px 25px 0;
  padding: 10px 13px;
  border-radius: 10px;
  background: #fbefe9;
  color: #965b42;
  font-size: 10px;
}

.journal-grid {
  display: grid;
  grid-template-columns: 1fr 270px;
  gap: 16px;
}

.panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 17px;
}

.panel-title {
  font: 18px 'Playfair Display',Georgia,serif;
  color: #35503a;
  margin-bottom: 13px;
}

.list-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 0;
  border-bottom: 1px solid #eff1e9;
  cursor: pointer;
}

.list-row:last-child {
  border-bottom: 0;
}

.thumb {
  width: 49px;
  height: 49px;
  object-fit: cover;
  border-radius: 10px;
  background: #e3eadc;
}

.row-main {
  min-width: 0;
  flex: 1;
}

.row-title {
  font: 16px 'Playfair Display',Georgia,serif;
  color: #344e38;
}

.row-sub {
  font-size: 9px;
  color: #929d90;
  margin-top: 4px;
}

.row-badge {
  font-size: 8px;
  background: #eff3e9;
  color: #71836b;
  border-radius: 20px;
  padding: 5px 8px;
}

.place-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 11px;
  background: #eef3e9;
  border-radius: 30px;
  color: #60765b;
  font-size: 10px;
  margin: 4px;
}

.bars {
  display: grid;
  gap: 13px;
}

.bar-row {
  display: grid;
  grid-template-columns: 95px 1fr 25px;
  gap: 10px;
  align-items: center;
  font-size: 10px;
  color: #778574;
}

.bar {
  height: 8px;
  background: #eef1e8;
  border-radius: 30px;
  overflow: hidden;
}

.bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg,#9bac84,#4f7452);
  border-radius: 30px;
}

.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: #1b3024a8;
  z-index: 30;
  padding: 20px;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(5px);
}

.modal-bg.show {
  display: flex;
  animation: fade .2s ease;
}

.modal {
  width: min(590px,100%);
  max-height: 90vh;
  overflow: auto;
  background: #fffefa;
  border-radius: 19px;
  padding: 22px;
  box-shadow: 0 25px 80px #14251a50;
  animation: pop .28s cubic-bezier(.2,.8,.2,1);
}

@keyframes fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes pop {
  from {
    opacity: 0;
    transform: translateY(18px) scale(.97);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.modal-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}

.close {
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 50%;
  background: #edf2e9;
  color: #50694d;
  font-size: 21px;
}

.modal-photo {
  width: 100%;
  max-height: 260px;
  object-fit: cover;
  border-radius: 12px;
  margin: 16px 0;
}

.success-overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: radial-gradient(ellipse at 50% 25%,#5e7955 0%,#2d4a36 42%,#1e3528 100%);
  display: grid;
  place-items: center;
  padding: 20px;
  overflow: hidden;
  animation: successFade .5s ease both;
  color: #fffdf4;
}

.success-overlay:before,.success-overlay:after {
  content: '❧';
  position: absolute;
  color: #d9e9c52b;
  font-size: 270px;
  pointer-events: none;
}

.success-overlay:before {
  left: -60px;
  bottom: -80px;
  transform: rotate(28deg);
  animation: slowSway 7s ease-in-out infinite alternate;
}

.success-overlay:after {
  right: -70px;
  top: -95px;
  transform: rotate(-28deg);
  animation: slowSway 8s ease-in-out infinite alternate-reverse;
}

@keyframes successFade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes slowSway {
  from {
    translate: 0 -10px;
    rotate: -7deg;
  }
  to {
    translate: 8px 12px;
    rotate: 8deg;
  }
}

.success-close {
  position: absolute;
  top: max(18px,env(safe-area-inset-top));
  right: 20px;
  width: 43px;
  height: 43px;
  border: 1px solid #ffffff60;
  background: #ffffff16;
  color: #fff;
  border-radius: 50%;
  font-size: 25px;
  z-index: 2;
}

.success-content {
  width: min(490px,100%);
  text-align: center;
  position: relative;
  z-index: 1;
  animation: successRise .8s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes successRise {
  from {
    opacity: 0;
    transform: translateY(28px) scale(.96);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.success-kicker {
  font-size: 9px;
  letter-spacing: 2.5px;
  color: #d8e6ce;
  font-weight: 700;
}

.success-emblem {
  width: 116px;
  height: 116px;
  border: 1px solid #dcebc36b;
  border-radius: 50%;
  margin: 0 auto 21px;
  display: grid;
  place-items: center;
  position: relative;
  background: #ffffff0b;
  box-shadow: 0 0 0 12px #ffffff08,0 0 0 26px #ffffff05;
  animation: emblemIn .8s .1s both;
}

.success-emblem:before,.success-emblem:after {
  content: '✦';
  position: absolute;
  color: #e4d3a0;
  font-size: 15px;
  animation: twinkle 2s ease-in-out infinite alternate;
}

.success-emblem:before {
  top: 0;
  right: 9px;
}

.success-emblem:after {
  bottom: 8px;
  left: 3px;
  animation-delay: .6s;
}

@keyframes emblemIn {
  from {
    opacity: 0;
    transform: scale(.5) rotate(-35deg);
  }
  to {
    opacity: 1;
    transform: scale(1) rotate(0);
  }
}

@keyframes twinkle {
  from {
    opacity: .3;
    transform: scale(.7);
  }
  to {
    opacity: 1;
    transform: scale(1.3);
  }
}

@keyframes leafFloat {
  0%,100% {
    transform: translateY(0) rotate(-3deg);
  }
  50% {
    transform: translateY(-7px) rotate(4deg);
  }
}

.success-leaf {

}

.success-content h2 {

}

            const fireflies = flies.map(([x, y], i) => `<i class="scene-firefly" style="--fly-x:${x}%;--fly-y:${y}%;--fly-delay:${i * .38}s;--fly-time:${3.5 + (i % 3)}s;--fly-size:${5 + i % 3}px"></i>`).join('');
            return `<div class="rarity-scene scene-uncommon" aria-hidden="true"><div class="scene-sunrays"></div><div class="scene-uncommon-breeze"></div><i class="scene-clearing-ripple ripple-one"></i><i class="scene-clearing-ripple ripple-two"></i><i class="scene-clearing-ripple ripple-three"></i>${fireflies}<span class="scene-moth" style="--moth-x:18%;--moth-y:36%;--moth-delay:.2s">🦋</span><span class="scene-moth" style="--moth-x:78%;--moth-y:64%;--moth-delay:1.4s">🦋</span></div>`;
        }

        if (rarity === 'Rare') {
            return `<div class="rarity-scene scene-rare" aria-hidden="true"><div class="scene-aurora scene-aurora-one"></div><div class="scene-aurora scene-aurora-two"></div><div class="scene-aurora scene-aurora-three"></div><div class="scene-rare-orbit"></div>${stars(20)}<div class="scene-shooting-star"></div><div class="scene-shooting-star scene-shooting-star-two"></div><div class="scene-shooting-star scene-shooting-star-three"></div></div>`;
        }

        if (rarity === 'Very rare') {
            const petals = Array.from({ length: 12 }, (_, i) => `<i class="scene-gold-petal" style="--petal-angle:${i * 30}deg;--petal-delay:${.22 + (i % 4) * .09}s"></i>`).join('');
            const rays = Array.from({ length: 20 }, (_, i) => `<i class="scene-nova-ray" style="--ray-angle:${i * 18}deg;--ray-delay:${.23 + (i % 5) * .055}s"></i>`).join('');
            const rings = [
                ['min(47vw, 250px)', '.12s', '27s'],
                ['min(69vw, 370px)', '.28s', '34s'],
                ['min(91vw, 510px)', '.46s', '42s']
            ].map(([size, delay, speed]) => `<div class="scene-portal-ring" style="--ring-size:${size};--ring-delay:${delay};--ring-speed:${speed}"></div>`).join('');
            const falling = Array.from({ length: 22 }, (_, i) => `<span style="--fall-x:${(i * 43 + 9) % 100}%;--fall-size:${11 + i % 4 * 3}px;--fall-delay:${(i % 9) * .42}s;--fall-time:${4.5 + (i % 4) * .7}s;--fall-drift:${i % 2 ? 25 : -25}px">${['✦', '✧', '❋', '⋆'][i % 4]}</span>`).join('');
            return `<div class="rarity-scene scene-very-rare" aria-hidden="true"><div class="scene-nova-rays"></div>${rays}${rings}<div class="scene-gold-bloom">${petals}<b class="scene-gold-core"></b></div><div class="scene-starfall">${falling}</div></div>`;
        }

        // Common and unrated sightings get a gentler, nature-inspired breeze.
        const leaves = ['❧', '✿', '❀', '❧', '✦', '❀', '❧', '✿', '❧'];
        return `<div class="rarity-scene scene-common" aria-hidden="true"><div class="scene-common-glow"></div><div class="scene-common-mist"></div>${leaves.map((leaf, i) => `<span class="scene-leaf" style="--leaf-x:${8 + i * 10}%;--leaf-y:${[72, 39, 57, 24, 81, 47, 15, 65, 31][i]}%;--leaf-delay:${i * .24}s;--leaf-size:${25 + (i % 3) * 7}px;--leaf-drift:${i % 2 ? 58 : -48}px">${leaf}</span>`).join('')}</div>`;
    }

    function showSuccess(s, entry) {
        const rarity = speciesRarity(s);
        const raritySlug = rarity.toLowerCase().replace(/\s+/g, '-');
        const overlay = document.createElement('div');
        overlay.className = `success-overlay success-rarity-${raritySlug}`;
        overlay.id = 'successOverlay';

        // Distinct visual scenes are selected by tier. Rarity still comes only from the field guide.
        const particleCounts = { Common: 0, Uncommon: 5, Rare: 9, 'Very rare': 16 };
        const particleSymbols = ['✦', '✧', '❋', '❀', '⋆'];
        const particles = Array.from({ length: particleCounts[rarity] || 0 }, (_, i) => {
            const positions = [
                [12, 30], [83, 24], [22, 70], [77, 74], [50, 14], [8, 54], [91, 51], [36, 18],
                [65, 37], [30, 84], [70, 88], [48, 76], [16, 12], [88, 13], [57, 58], [42, 92]
            ];
            const [x, y] = positions[i];
            const delay = (i % 6) * 0.23;
            const size = rarity === 'Very rare' ? 13 + (i % 4) * 3 : 11 + (i % 3) * 2;
            const dx = (i % 2 ? 1 : -1) * (12 + (i % 4) * 8);
            return `<span style="--x:${x}%;--y:${y}%;--delay:${delay}s;--size:${size}px;--dx:${dx}px">${particleSymbols[i % particleSymbols.length]}</span>`;
        }).join('');

        overlay.innerHTML = `
            <button class="success-close" data-action="closeSuccess" aria-label="Close">×</button>
            ${celebrationSceneMarkup(rarity)}
            ${particles ? `<div class="success-particles" aria-hidden="true">${particles}</div>` : ''}
            <div class="success-content">
                <div class="success-emblem"><div class="success-leaf">❧</div></div>
                <div class="success-kicker">${rarity === 'Very rare' ? 'AN EXTRAORDINARY ENCOUNTER' : rarity === 'Rare' ? 'A SPECIAL FIELD DISCOVERY' : rarity === 'Uncommon' ? 'A LOVELY UNEXPECTED FIND' : 'A LITTLE MOMENT, KEPT FOREVER'}</div>
                <h2>${rarity === 'Very rare' ? 'What an extraordinary find!' : rarity === 'Rare' ? 'A special discovery.' : 'What a lovely discovery.'}</h2>
                <p class="success-species">${esc(s.name)}</p>
                <span class="success-rarity-label rarity-tag ${rarityClass(rarity)}">${rarityIcon(rarity)} ${esc(rarity)} encounter</span>
                <p class="success-copy">${rarity === 'Very rare' ? 'A remarkable sighting. This one deserves a special place in your Fieldnote journal.' : rarity === 'Rare' ? 'An uncommon moment worth remembering. Your discovery has been saved to Fieldnote.' : 'Your sighting has found its place in Fieldnote. Every small encounter makes your nature journal a little richer.'}</p>
                ${entry.photo ? `<img class="success-photo" src="${entry.photo}" alt="Your discovery">` : ''}
                <div class="success-actions">
                    <button class="success-see" data-action="seeCollection" data-id="${esc(s.id)}">See in my collection&nbsp; →</button>
                    <button class="success-later" data-action="closeSuccess">× &nbsp;Close</button>
                </div>
                <div class="success-foot">${entry.lat != null ? 'Map pin saved with this sighting' : 'Saved to your nature journal'}</div>
            </div>`;
        shell.appendChild(overlay);
    }
    function openSpecies(id) { const s = getSpecies(id); if (!s)
        return; const related = data.sightings.filter(x => x.speciesId === id).sort((a, b) => b.date.localeCompare(a.date)), current = speciesRarity(s), automatic = !!catalogMatch(s); $('modal').innerHTML = `<div class="modal-top"><div><div class="eyebrow">${esc(s.category).toUpperCase()} · SPECIES PROFILE</div><div class="section-title">${esc(s.name)}</div><div class="latin">${esc(s.latin || 'Scientific name not added')}</div></div><button class="close" data-action="closeModal" aria-label="Close">×</button></div>${s.photo ? `<img class="modal-photo" src="${esc(s.photo)}" alt="${esc(s.name)}">` : ''}<p class="subtitle">${s.count || related.length} encounter(s) · First spotted ${dateLabel(s.first)}</p><section class="rarity-editor"><div><div class="panel-title">Fieldnote rarity guide</div><p class="rarity-help">${automatic ? 'An automatic estimate of how often this species is encountered in the eastern North Carolina / eastern U.S. region. It can vary with season, habitat, and exact location; it is not a conservation status.' : 'This species is not in Fieldnote’s built-in guide yet, so it stays unrated rather than guessing.'}</p></div><div><span class="rarity-tag ${rarityClass(current)}" style="position:static;display:inline-flex">${rarityIcon(current)} ${esc(current)}</span></div><div class="rarity-feedback">${esc(rarityDescription(current))}</div></section><div style="margin-top:18px" class="panel-title">Sighting history</div>${related.map(x => `<div class="list-row"><div class="row-main"><div class="row-title">${dateLabel(x.date)} · ${esc(x.time || '')}</div><div class="row-sub">${esc(x.location || 'Place not recorded')}</div></div>${x.lat != null ? `<a class="secondary" href="https://www.openstreetmap.org/?mlat=${x.lat}&mlon=${x.lon}#map=15/${x.lat}/${x.lon}" target="_blank" rel="noopener">Map ↗</a>` : '<span class="meta">No pin</span>'}</div>`).join('')}<button class="primary" data-action="another" data-id="${esc(s.id)}" style="margin-top:16px">＋ &nbsp;Spot this again</button>`; $('modalBg').classList.add('show'); }
    // Delegated events keep working as the screen changes.
    shell.addEventListener('click', e => { const modeBtn = e.target.closest('[data-spot-mode]'); if (modeBtn) {
        spotMode = modeBtn.dataset.spotMode;
        if (spotMode === 'finder') {
            finderStage = 1;
            finderMatches = [];
        }
        render();
        return;
    } const finderClueBtn = e.target.closest('[data-finder-clue]'); if (finderClueBtn) {
        runSpeciesFinder(finderClueBtn.dataset.finderClue);
        return;
    } const finderPick = e.target.closest('[data-finder-pick]'); if (finderPick) {
        chooseFinderSpecies(finderPick.dataset.finderCategory, Number(finderPick.dataset.finderPick));
        return;
    } const speciesOption = e.target.closest('[data-species-index]'); if (speciesOption) {
        chooseCatalogSpecies(Number(speciesOption.dataset.speciesIndex));
        return;
    } const customOption = e.target.closest('[data-species-custom]'); if (customOption) {
        chooseCustomSpecies();
        return;
    } const navBtn = e.target.closest('[data-page]'); if (navBtn) {
        if (navBtn.dataset.page === 'spot') {
            draft = {};
            spotMode = 'pick';
        }
        nav(navBtn.dataset.page);
        return;
    } const f = e.target.closest('[data-filter]'); if (f) {
        filter = f.dataset.filter;
        render();
        return;
    } const open = e.target.closest('[data-open]'); if (open) {
        openSpecies(open.dataset.open);
        return;
    } const habitat = e.target.closest('[data-category]'); if (habitat) {
        draft = { category: habitat.dataset.category };
        spotMode = 'pick';
        nav('spot');
        return;
    } const a = e.target.closest('[data-action]'); if (!a)
        return; const action = a.dataset.action; if (action === 'runFinder') {
        runSpeciesFinder(finderClue);
        return;
    } if (action === 'finderBack') {
        finderStage = 1;
        finderMatches = [];
        render();
        return;
    } if (action === 'log')
        saveDiscovery(); if (action === 'locate')
        locate(); if (action === 'startPin') {
        pinTargetId = a.dataset.id;
        render();
        $('placesMap')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
    } if (action === 'cancelPin') {
        pinTargetId = null;
        render();
        return;
    } if (action === 'clearLocation') {
        draft.lat = null;
        draft.lon = null;
        draft.locationAccuracy = null;
        draft.coordSource = null;
        if (draft.place === 'Current location')
            draft.place = '';
        render();
    } if (action === 'closeSuccess')
        $('successOverlay')?.remove(); if (action === 'seeCollection') {
        const id = a.dataset.id;
        $('successOverlay')?.remove();
        if (id)
            openSpecies(id);
    } if (action === 'closeModal')
        $('modalBg').classList.remove('show'); if (action === 'another') {
        const s = getSpecies(a.dataset.id);
        $('modalBg').classList.remove('show');
        const found = collectionForCategory(s.category).findIndex(x => x[0] === s.name);
        draft = { category: s.category, speciesKey: found >= 0 ? 'c' + found : '__custom__', speciesName: s.name, customName: s.name, customLatin: s.latin || '' };
        nav('spot');
        const input = $('speciesSearch');
        if (input)
            input.value = s.name;
        if (found < 0) {
            $('customFields').style.display = 'block';
            updateSpeciesRarityPreview();
        }
    } if (action === 'export') {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), u = URL.createObjectURL(blob), a2 = document.createElement('a');
        a2.href = u;
        a2.download = 'fieldnote-backup.json';
        a2.click();
        setTimeout(() => URL.revokeObjectURL(u), 1000);
    } });
    shell.addEventListener('change', async (e) => { if (e.target.id === 'finderCategory') {
        finderCategory = e.target.value;
        finderClue = 'not_sure';
        finderMatches = [];
        finderStage = 1;
        render();
        return;
    } if (e.target.id === 'category') {
        draft.category = e.target.value;
        draft.speciesKey = '';
        draft.speciesName = '';
        draft.customName = '';
        draft.customLatin = '';
        render();
        return;
    } if (e.target.id === 'timeOfDay') {
        draft.time = e.target.value;
        return;
    } if (e.target.id === 'place') {
        draft.place = e.target.value === '__gps__' ? 'Current location' : e.target.value;
        $('customPlace').style.display = e.target.value === '__other__' ? 'block' : 'none';
        return;
    } if (['photoFile', 'photoLibraryFile', 'photoCameraFile'].includes(e.target.id)) {
        const file = e.target.files?.[0];
        if (!file)
            return;
        if (!file.type.startsWith('image/')) {
            notify('Choose an image file.');
            return;
        }
        if (file.size > 20 * 1024 * 1024) {
            notify('Choose a photo under 20 MB.');
            return;
        }
        try {
            draft.photo = await compressPhoto(file);
            render();
            notify('Photo added to your field note.');
        }
        catch (err) {
            notify(err.message || 'Could not add that photo.');
        }
    } if (e.target.id === 'importFile') {
        const file = e.target.files?.[0];
        if (!file)
            return;
        const reader = new FileReader();
        reader.onload = () => { try {
            const x = JSON.parse(reader.result);
            if (!Array.isArray(x.species) || !Array.isArray(x.sightings))
                throw Error();
            if (confirm('Replace this journal with the selected backup?')) {
                data = x;
                save();
                nav('collection');
                notify('Journal backup restored.');
            }
        }
        catch (err) {
            notify('That backup file is not valid.');
        } };
        reader.readAsText(file);
    } });
    shell.addEventListener('input', e => { if (e.target.id === 'searchBox') {
        search = e.target.value;
        if (page !== 'collection')
            nav('collection');
        else
            render();
        return;
    } if (e.target.id === 'speciesSearch') {
        const typed = e.target.value.trim(), cat = $('category')?.value || 'Birds', list = collectionForCategory(cat), query = normalizeSpeciesQuery(typed), exact = list.findIndex(x => normalizeSpeciesQuery(x[0]) === query || normalizeSpeciesQuery(x[1]) === query);
        draft.speciesName = typed;
        if (!typed) {
            draft.speciesKey = '';
            draft.customName = '';
        }
        else if (exact >= 0) {
            draft.speciesKey = 'c' + exact;
            draft.speciesName = list[exact][0];
        }
        else if (draft.speciesKey !== '__custom__') {
            draft.speciesKey = '';
            draft.customName = '';
        }
        updateSpeciesResults();
        updateSpeciesRarityPreview();
        return;
    } if (e.target.id === 'customLatin')
        draft.customLatin = e.target.value; if (e.target.id === 'customPlace')
        draft.customPlace = e.target.value; });
    shell.addEventListener('focusin', e => { if (e.target.id === 'speciesSearch') {
        activeSpeciesResult = 0;
        updateSpeciesResults();
    } });
    shell.addEventListener('keydown', e => { if (e.target.id !== 'speciesSearch')
        return; if (e.key === 'Escape') {
        hideSpeciesResults();
        return;
    } if (e.key === 'ArrowDown') {
        e.preventDefault();
        if ($('speciesResults')?.hidden)
            updateSpeciesResults();
        else
            moveSpeciesResult(1);
        return;
    } if (e.key === 'ArrowUp') {
        e.preventDefault();
        moveSpeciesResult(-1);
        return;
    } if (e.key === 'Enter') {
        const options = [...($('speciesResults')?.querySelectorAll('[data-picker-option]') || [])], selected = options[activeSpeciesResult];
        if (selected) {
            e.preventDefault();
            if (selected.hasAttribute('data-species-index'))
                chooseCatalogSpecies(Number(selected.dataset.speciesIndex));
            else
                chooseCustomSpecies();
        }
        else {
            const first = $('speciesResults')?.querySelector('[data-species-index]');
            if (first) {
                e.preventDefault();
                chooseCatalogSpecies(Number(first.dataset.speciesIndex));
            }
        }
    } });
    $('modalBg').addEventListener('click', e => { if (e.target === $('modalBg'))
        $('modalBg').classList.remove('show'); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') {
        $('modalBg').classList.remove('show');
        $('successOverlay')?.remove();
    } });
    syncAutomaticRarity();
    render();
})();
</script>

<script>
/* Detect portrait uploads after load (including images added by collection re-renders).
   Portrait thumbnails use an equal center crop; landscape thumbnails retain their fit. */
(() => {
    const root = document.getElementById('app');
    if (!root)
        return;
    const checkPortraits = () => {
        root.querySelectorAll('.species-photo img.species-photo-main').forEach(img => {
            if (img.dataset.portraitCenterChecked === '1')
                return;
            const apply = () => {
                if (!img.naturalWidth || !img.naturalHeight)
                    return;
                const portrait = img.naturalHeight > img.naturalWidth;
                img.classList.toggle('is-portrait', portrait);
                img.dataset.portraitCenterChecked = '1';
                /* CSS above owns thumbnail framing; the detector only tags orientation. */
            };
            if (img.complete)
                apply();
            else
                img.addEventListener('load', apply, { once: true });
        });
    };
    checkPortraits();
    const observer = new MutationObserver(checkPortraits);
    observer.observe(root, { childList: true, subtree: true });
})();
</script>
